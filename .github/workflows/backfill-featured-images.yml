name: Backfill featured images

# One-time / on-demand: generates featured images for any already-published blog
# post that shipped without one (posts drafted while the OpenAI account was out of
# credits — the image step is non-fatal, so they published text-only). Reuses the
# same Haiku-prompt → gpt-image-1 pipeline as the weekly draft job, then regenerates
# the blur map and commits the results to main. Idempotent: posts that already have
# a featuredImage are skipped, so re-running never re-charges for existing images.

on:
  workflow_dispatch:

jobs:
  backfill:
    name: Generate missing featured images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Backfill featured images
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is missing."
            exit 1
          fi
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY secret is missing."
            exit 1
          fi
          npx tsx scripts/backfill-featured-images.ts

      - name: Regenerate blur map
        run: npm run blur:gen

      - name: Commit and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/blog-*.png lib/blog/data.ts lib/blur-map.json
          if git diff --cached --quiet; then
            echo "No changes to commit — every published post already had a featured image."
            exit 0
          fi
          git commit -m "content: backfill featured images for imageless blog posts"
          git push origin HEAD:main

      - name: Trigger Netlify rebuild
        if: success()
        env:
          HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "NETLIFY_BUILD_HOOK_URL not set — skipping explicit rebuild (git push may already trigger a deploy)."
            exit 0
          fi
          curl --fail --show-error -X POST -d '{}' "$HOOK_URL"
          echo "Netlify rebuild triggered."
