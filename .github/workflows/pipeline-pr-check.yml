name: PR check

# Type-check + production build on EVERY pull request to main.
#
# This was previously gated on `startsWith(github.head_ref, 'drafts/') ||
# startsWith(github.head_ref, 'proposals/')`, because it was written for the
# blog pipeline. The effect was that any `feat/`, `fix/` or `docs/` branch
# reported this check as SKIPPED — which GitHub treats as a pass — so a
# hand-written PR could show all-green having never been type-checked or
# built. The only other PR checks are Netlify's header/redirect rules, which
# do not compile anything.
#
# That gap was not theoretical: PR #35 introduced a `export const` in a
# `"use server"` module, which fails `next build` and would have landed with
# green checks. It was caught only because the author happened to run the
# build locally.
#
# It remains the gate for the auto-merge pipeline too. `auto-merge-drafts.yml`
# calls `gh pr checks` (all checks, no name matching) before squash-merging, so
# a failure here still stops bad code reaching main and breaking the Monday
# Netlify rebuild.

on:
  pull_request:
    branches: [main]

jobs:
  check:
    # Job name is load-bearing: it is the check name shown on PRs and is what
    # any branch-protection rule would reference. Renaming it silently detaches
    # that rule, so leave it alone.
    name: Type-check + production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
