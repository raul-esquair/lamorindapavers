name: Weekly blog publish

# Triggers a Netlify rebuild every Monday so pre-written blog posts whose
# `date` field has now passed become visible on the site.

on:
  schedule:
    # Every Monday at 14:00 UTC = 7am PDT (summer) / 6am PST (winter)
    - cron: '0 14 * * 1'
  workflow_dispatch:

jobs:
  trigger-netlify-rebuild:
    name: Trigger Netlify rebuild
    runs-on: ubuntu-latest
    steps:
      - name: POST to Netlify build hook
        env:
          HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "::error::NETLIFY_BUILD_HOOK_URL secret is missing."
            exit 1
          fi
          echo "Triggering Netlify rebuild..."
          curl --fail --show-error -X POST -d '{}' "$HOOK_URL"
          echo ""
          echo "Rebuild triggered. Monitor progress in the Netlify dashboard."

      - name: Checkout (for discovery scripts)
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Give Netlify a head start so re-fetched URLs serve the new build.
      - name: Wait for deploy to propagate
        run: sleep 120

      # Best-effort discovery nudges — never fail the publish over them.
      - name: Resubmit sitemap to Google
        continue-on-error: true
        env:
          GSC_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON_BASE64 }}
          GSC_PROPERTY_URL: ${{ secrets.GSC_PROPERTY_URL }}
        run: npx tsx scripts/resubmit-sitemap.ts

      - name: Submit new URLs to IndexNow (Bing/Yandex)
        continue-on-error: true
        run: npx tsx scripts/submit-indexnow.ts
